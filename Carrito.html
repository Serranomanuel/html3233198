<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito de compras</title>
</head>
<body>

    <h1>Carrito de Compras</h1>

    <form action="/procesar-pedido" method="post">
        <table>
            <thead>
                <tr>
                    <th>Producto</th>
                    <th>Precio</th>
                    <th>Cantidad</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Camiseta de Algodón</td>
                    <td>$25.00</td>
                    <td>
                        <label for="cantidad-camiseta">Cantidad:</label>
                        <input type="number" id="cantidad-camiseta" name="cantidad_camiseta" value="0" min="0">
                    </td>
                </tr>

                <tr>
                    <td>Pantalón Vaquero</td>
                    <td>$55.00</td>
                    <td>
                        <label for="cantidad-pantalon">Cantidad:</label>
                        <input type="number" id="cantidad-pantalon" name="cantidad_pantalon" value="0" min="0">
                    </td>
                </tr>

                <tr>
                    <td>Zapatillas Deportivas</td>
                    <td>$80.00</td>
                    <td>
                        <label for="cantidad-zapatillas">Cantidad:</label>
                        <input type="number" id="cantidad-zapatillas" name="cantidad_zapatillas" value="0" min="0">
                    </td>
                </tr>
            </tbody>
        </table>

        <p>
            <input type="submit" value="Confirmar Compra">
        </p>
    </form>
</html>
